<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Boxer - Model: Joe (Full Body & Head)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* UI Panel Left */
    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.08);
      width: 330px;
      z-index: 10;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.7rem;
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }
    p.desc {
      margin: 0 0 10px 0;
      font-size: 0.8rem;
      color: #6b7280;
      line-height: 1.45;
    }

    /* Mode Banner & Indicators */
    .mode-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      background: #f3f4f6;
      color: #4b5563;
      border: 1px solid #e5e7eb;
      transition: all 0.2s ease;
    }
    .mode-indicator.active-multi {
      background: #fff1f2;
      color: #e11d48;
      border-color: #fda4af;
      box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.15);
    }
    .key-tag {
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      color: #111827;
    }

    .axis-legend {
      display: flex;
      gap: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 0;
      border-top: 1px dashed #e5e7eb;
      margin-top: 6px;
    }
    .axis-tag {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }
    .dot-x { background: #ef4444; }
    .dot-z { background: #3b82f6; }
    .dot-y { background: #10b981; }

    .stats {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #e5e7eb;
      padding-top: 10px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: #374151;
    }

    /* Modal / Inspector for Single & Group Mark */
    #inspect-card {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.14);
      border: 1px solid #e5e7eb;
      width: 360px;
      padding: 20px;
      display: none;
      z-index: 20;
      animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideIn {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    #inspect-card h3 {
      margin: 0 0 10px 0;
      font-size: 1rem;
      color: #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tag-id {
      font-family: monospace;
      font-size: 0.72rem;
      color: #4f46e5;
      background: #eef2ff;
      padding: 3px 7px;
      border-radius: 6px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      color: #4b5563;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    textarea {
      width: 100%;
      height: 75px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      resize: none;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .status-select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 0.85rem;
      background: #fff;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-save {
      background: #2563eb;
      color: white;
    }
    .btn-save:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #f3f4f6;
      color: #4b5563;
    }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }
    .btn-danger:hover { background: #fecaca; }

    /* Color Palette Picker Panel (Collapsible) */
    #palette-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.08);
      width: 240px;
      z-index: 15;
      transition: all 0.2s ease;
    }
    #palette-panel.collapsed #palette-body {
      display: none;
    }
    #palette-panel.collapsed h2 {
      margin-bottom: 0;
    }
    .btn-toggle-palette {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .btn-toggle-palette:hover {
      background: #e5e7eb;
    }
    #palette-panel h2, #anim-panel h2 {
      margin: 0 0 10px 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .color-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      font-size: 0.78rem;
      color: #374151;
    }
    .color-picker-input {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 28px;
      height: 24px;
      background-color: transparent;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    .color-picker-input::-webkit-color-swatch {
      border-radius: 4px;
      border: 1px solid #d1d5db;
    }

    /* Animation Studio Panel */
    #anim-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      padding: 14px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.08);
      width: 250px;
      z-index: 15;
    }
    .anim-btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .anim-btn {
      padding: 7px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }
    .anim-btn:hover {
      background: #f3f4f6;
    }
    .anim-btn.active {
      background: #eef2ff;
      color: #4f46e5;
      border-color: #a5b4fc;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
    }
    .speed-slider {
      width: 100%;
      margin-top: 8px;
    }

    /* Camera Navigation & Quick Focus Panel (WASD & Focus Presets) */
    #camera-nav-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.08);
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: none;
    }
    .cam-nav-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: #1f2937;
      flex-wrap: wrap;
    }
    .cam-focus-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .cam-focus-btn {
      padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 0.77rem;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .cam-focus-btn:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
      transform: translateY(-1px);
    }
    .cam-focus-btn.head-btn {
      background: #eff6ff;
      color: #2563eb;
      border-color: #93c5fd;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.15);
    }
    .cam-focus-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    .cam-keys-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.74rem;
      color: #6b7280;
      flex-wrap: wrap;
    }
    .cam-keys-hint b {
      color: #1f2937;
      background: #f3f4f6;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #e5e7eb;
      font-family: monospace;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <!-- Ẩn cục Project Boxer theo yêu cầu cho thoáng màn hình (vẫn giữ DOM ID để không lỗi JS) -->
  <div id="ui-panel" style="display: none;">
    <span id="mode-badge"><span id="mode-text"></span></span>
    <span id="sync-status-indicator"></span>
    <b id="stat-total">0</b>
    <b id="stat-selected">0</b>
    <b id="stat-marked">0</b>
    <button id="btn-sync-file"></button>
    <button id="btn-export-json"></button>
    <button id="btn-view-data"></button>
    <div id="sync-notice"></div>
  </div>

  <!-- Color Palette Tool (Có nút Thu Gọn / Mở Rộng) -->
  <div id="palette-panel">
    <h2>
      <span>🎨 Bảng Màu Da</span>
      <button class="btn-toggle-palette" id="btn-toggle-palette">Thu gọn ▲</button>
    </h2>
    <div id="palette-body">
      <div class="color-row">
        <span>Da Chính (Skin)</span>
        <input type="color" id="pick-skin" class="color-picker-input" value="#e5b894">
      </div>
      <div class="color-row">
        <span>Đế & Lòng Bàn Chân</span>
        <input type="color" id="pick-sole" class="color-picker-input" value="#d49e7b">
      </div>
      <div class="color-row">
        <span>Gót & Cơ Đậm</span>
        <input type="color" id="pick-heel" class="color-picker-input" value="#d99f7d">
      </div>
      <div class="color-row">
        <span>Cổ Chân & Mắt Cá</span>
        <input type="color" id="pick-ankle" class="color-picker-input" value="#dfa886">
      </div>
      <div class="color-row">
        <span>Móng Chân</span>
        <input type="color" id="pick-nail" class="color-picker-input" value="#f8e7df">
      </div>
      <div class="color-row">
        <span>Tóc (Hair)</span>
        <input type="color" id="pick-hair" class="color-picker-input" value="#2b1d14">
      </div>
      <div class="color-row" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; justify-content:space-between;">
          <span>Độ dài tóc</span><b id="hair-len-val">0%</b>
        </div>
        <input type="range" id="hair-length" min="0" max="1" step="0.05" value="0" style="width:100%;">
      </div>
    </div>
  </div>

  <!-- Animation Control Panel -->
  <div id="anim-panel">
    <h2>🎬 Animation Studio</h2>
    <div class="anim-btn-group">
      <button class="anim-btn active" id="btn-anim-none">⏸️ Đứng yên (T-Pose / Edit)</button>
      <button class="anim-btn" id="btn-anim-swing">🚶 Đưa 2 chân qua lại (Swing)</button>
      <button class="anim-btn" id="btn-anim-march">🦵 Nhấc chân lên xuống (March)</button>
      <button class="anim-btn" id="btn-anim-bounce">🥊 Nhún chân Boxer (Shuffle)</button>
    </div>
    <div style="margin-top: 10px; font-size: 0.75rem; color: #4b5563;">
      <div style="display:flex; justify-content:space-between;">
        <span>Tốc độ:</span>
        <b id="speed-val">1.0x</b>
      </div>
      <input type="range" id="anim-speed" class="speed-slider" min="0.2" max="3.0" step="0.1" value="1.0">
    </div>
  </div>

  <!-- Bảng Điều Khiển Camera WASD & Quick Focus Góc Nhìn Chi Tiết -->
  <div id="camera-nav-panel">
    <div class="cam-nav-header">
      <span>🎮 <b>Góc nhìn:</b></span>
      <div class="cam-focus-pills">
        <button class="cam-focus-btn head-btn" id="btn-focus-head">🎯 Xem Đầu (Cận cảnh)</button>
        <button class="cam-focus-btn" id="btn-focus-torso">🥋 Thân</button>
        <button class="cam-focus-btn" id="btn-focus-legs">🦵 Chân</button>
        <button class="cam-focus-btn" id="btn-focus-feet">🦶 Bàn Chân</button>
        <button class="cam-focus-btn" id="btn-focus-all">🧍 Toàn Thân</button>
      </div>
    </div>
    <div class="cam-keys-hint">
      <span>🕹️ Phím <b>W</b>/<b>S</b>: Tiến / Lùi</span>
      <span>•</span>
      <span><b>A</b>/<b>D</b>: Trái / Phải</span>
      <span>•</span>
      <span><b>Q</b>/<b>E</b>: Xuống / Lên</span>
      <span>•</span>
      <span><b>M</b>: Chọn nhóm</span>
      <span>•</span>
      <span>🖱️ Chuột trái: Xoay</span>
    </div>
  </div>

  <!-- Inspector Card for Single or Group of Blocks -->
  <div id="inspect-card">
    <h3>
      <span id="card-part-name">Chi tiết khối</span>
      <span class="tag-id" id="card-block-id">#ID</span>
    </h3>

    <div id="group-selected-container" style="display: none; margin-bottom: 10px;">
      <label>Danh sách các khối đang chọn (<span id="group-count">0</span>):</label>
      <div id="group-chips"></div>
    </div>

    <div class="field" id="dim-field">
      <label>Kích thước (Dài x Cao x Rộng)</label>
      <div id="card-dimensions" style="font-size: 0.8rem; font-family: monospace; color: #4b5563;">0 x 0 x 0</div>
    </div>

    <div class="field">
      <label>Trạng thái (Status)</label>
      <select id="card-status" class="status-select">
        <option value="ok">✅ Bình thường (OK / Reset về gốc)</option>
        <option value="needs_fix">⚠️ Cần chỉnh sửa (Needs Fix)</option>
        <option value="wrong_size">📏 Sai tỉ lệ / kích thước (Wrong Scale)</option>
        <option value="reposition">📐 Cần dời vị trí (Reposition)</option>
        <option value="delete">❌ Khối dư thừa / Cần xoá</option>
      </select>
    </div>

    <div class="field">
      <label>Ghi chú lỗi / Yêu cầu ("Mark" Note)</label>
      <textarea id="card-note" placeholder="Nhập ghi chú cho khối này hoặc toàn bộ nhóm khối vừa chọn..."></textarea>
    </div>

    <div class="btn-group">
      <button class="btn-save" id="btn-save-mark">💾 Lưu thay đổi</button>
      <button class="btn-secondary" id="btn-close-card">Đóng</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // ==========================================
    // 1. REAL-TIME LOCAL DATABASE SYNC
    // Tự động đồng bộ với Backend Local Server (marks_db.json)
    // ==========================================
    const SERVER_URL = window.location.origin;
    let localDB = {};

    // Đồng bộ tức thì lên Server ổ đĩa
    async function syncToServer(dataToSave) {
      try {
        await fetch(`${SERVER_URL}/api/marks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataToSave)
        });
        console.log('✅ Đã đồng bộ tức thì vào file marks_db.json trên ổ đĩa!');
        const syncStatusEl = document.getElementById('sync-status-indicator');
        if (syncStatusEl) {
          syncStatusEl.innerHTML = '🟢 <b>Đã đồng bộ ổ đĩa (Auto-Synced)</b>';
        }
      } catch (err) {
        // Fallback lưu LocalStorage nếu server chưa bật
        console.warn('Server chưa phản hồi, lưu tạm LocalStorage:', err);
        localStorage.setItem('PROJECT_BOXER_DATA', JSON.stringify(localDB));
      }
    }

    // Nạp dữ liệu lúc mở trang: Ưu tiên Server file
    async function initDB() {
      try {
        const res = await fetch(`${SERVER_URL}/api/marks`);
        if (res.ok) {
          const serverData = await res.json();
          localDB = serverData;
        }
      } catch (e) {
        console.log('Chưa kết nối server, đọc LocalStorage...');
        localDB = JSON.parse(localStorage.getItem('PROJECT_BOXER_DATA') || '{}');
      }

      // Cập nhật giao diện 3D theo DB
      applyDBToMeshes();
      updateStats();
    }

    // ==========================================
    // 2. THREE.JS SCENE SETUP
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f4f7);
    scene.fog = new THREE.Fog(0xf4f4f7, 12, 45);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4.6, 3.8, 6.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2 - 0.01; // Không lật camera xuống đáy đất
    controls.minDistance = 0.6;
    controls.maxDistance = 32;
    controls.target.set(0, 2.30, 0.0);

    // Ánh sáng tạo bóng khối sắc cạnh phong cách Voxel
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(6, 14, 6);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.0003;
    const d = 6;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0xdbeafe, 0.3);
    rimLight.position.set(-6, 8, -6);
    scene.add(rimLight);

    // ==========================================
    // 3. THẢM SÀN, LƯỚI & HỆ TRỤC TỌA ĐỘ THAM CHIẾU (X, Y, Z)
    // Mở rộng sâu theo trục Z và thêm nhãn / đầu mũi tên trực quan
    // ==========================================
    const floorGeo = new THREE.PlaneGeometry(80, 80);
    const floorMat = new THREE.ShadowMaterial({ opacity: 0.12 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Lưới grid phụ mở rộng
    const grid = new THREE.GridHelper(24, 48, 0xd1d5db, 0xe5e7eb);
    grid.position.y = 0.001;
    scene.add(grid);

    // Hàm tạo thân vạch trục dẹt
    function createFloorAxis(color, length, thickness, isX = true, offsetPos = 0) {
      const geo = isX 
        ? new THREE.BoxGeometry(length, 0.002, thickness)
        : new THREE.BoxGeometry(thickness, 0.002, length);
      const mat = new THREE.MeshBasicMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = 0.002;
      if (isX) mesh.position.x = offsetPos;
      else mesh.position.z = offsetPos;
      return mesh;
    }

    // Hàm tạo đầu mũi tên 3D vuông góc (Arrow Head Voxel)
    function createVoxelArrowHead(color, pos, rotY = 0) {
      const arrowGroup = new THREE.Group();
      // Bậc mũi tên nhọn dần
      const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.003, 0.04), new THREE.MeshBasicMaterial({ color }));
      const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.003, 0.04), new THREE.MeshBasicMaterial({ color }));
      const b3 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.003, 0.04), new THREE.MeshBasicMaterial({ color }));
      const b4 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.003, 0.04), new THREE.MeshBasicMaterial({ color }));

      b1.position.z = -0.06;
      b2.position.z = -0.02;
      b3.position.z = 0.02;
      b4.position.z = 0.06;

      arrowGroup.add(b1, b2, b3, b4);
      arrowGroup.position.set(pos[0], 0.003, pos[1]);
      arrowGroup.rotation.y = rotY;
      return arrowGroup;
    }

          roughness: 0.35,

        const isMarked = localDB[spec.id] && localDB[spec.id].status !== 'ok';
        const displayColor = isMarked ? COLOR_PALETTE.marked_flag : spec.color;

        const material = new THREE.MeshStandardMaterial({
          color: displayColor,
          roughness: 0.35,
          metalness: 0.05
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(spec.pos[0], spec.pos[1], spec.pos[2]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        mesh.userData = {
          id: spec.id,
          category: spec.category,
          name: spec.name,
          dimensions: spec.size,
          defaultColor: spec.color
        };

        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.22, transparent: true })
        );
        mesh.add(line);

        const selectBoxGeo = new THREE.BoxGeometry(spec.size[0] * 1.05, spec.size[1] * 1.05, spec.size[2] * 1.05);
        const selectBoxEdges = new THREE.EdgesGeometry(selectBoxGeo);
        const selectBoxLine = new THREE.LineSegments(
          selectBoxEdges,
          new THREE.LineBasicMaterial({ color: 0xf59e0b, linewidth: 2 })
        );
        selectBoxLine.name = 'selection_highlight';
        selectBoxLine.visible = false;
        mesh.add(selectBoxLine);

        pelvisGroup.add(mesh);
        clickableMeshes.push(mesh);

        const displayColor = isMarked ? COLOR_PALETTE.marked_flag : spec.color;

        const material = new THREE.MeshStandardMaterial({
          color: displayColor,
          roughness: 0.35,
          metalness: 0.05
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(spec.pos[0], spec.pos[1], spec.pos[2]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        mesh.userData = {
          id: spec.id,
          category: spec.category,
          name: spec.name,
          dimensions: spec.size,
          defaultColor: spec.color,
          side: sidePrefix
        };

        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.22, transparent: true })
        );
        mesh.add(line);

        const selectBoxGeo = new THREE.BoxGeometry(spec.size[0] * 1.05, spec.size[1] * 1.05, spec.size[2] * 1.05);

          selectBoxEdges,
          new THREE.LineBasicMaterial({ color: 0xf59e0b, linewidth: 2 })
        );
        selectBoxLine.name = 'selection_highlight';
        selectBoxLine.visible = false;
        mesh.add(selectBoxLine);

        clickableMeshes.push(mesh);

        // Mặc định ẩn (độ dài = 0). Dùng thanh trượt "Độ dài tóc" để kéo dài xuống.

        const displayColor = isMarked ? COLOR_PALETTE.marked_flag : spec.color;

        const material = new THREE.MeshStandardMaterial({
          color: displayColor,
          roughness: 0.35,
          metalness: 0.05
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(spec.pos[0], spec.pos[1], spec.pos[2]);

          id: spec.id,
          category: spec.category,
          name: spec.name,
          dimensions: spec.size,

        );

    // Cập nhật độ dài tóc phụ (0 -> 1)
    function setHairLength(t) {
      hairExtMeshes.forEach(m => {
        const h = Math.max(0.0001, m.userData.ext.maxH * t);
        m.visible = t > 0.01;
        m.scale.y = h;
        m.position.y = m.userData.ext.top - h / 2;
      });
    }

    // Hierarchy Rig Structure: Tạo khớp háng / chân, khung chậu, đầu & khớp vai / cánh tay
    const legRigR = new THREE.Group();
    const legRigL = new THREE.Group();
    const armRigR = new THREE.Group();
    const armRigL = new THREE.Group();
    const pelvisRig = createPelvisAndHips();
    const headRig = createDetailedHead();
    pelvisRig.add(headRig); // Ráp đầu liền khối với trục cổ và thân trên
    setHairLength(0);

    // Điểm Pivot xoay chân đặt ở khớp háng (Hip Joint Y = 2.42m)
    const HIP_PIVOT_Y = 2.42;
    legRigR.position.set(0, HIP_PIVOT_Y, 0);
    legRigL.position.set(0, HIP_PIVOT_Y, 0);

    const rightFootMeshGroup = createDetailedFoot(1);
    const leftFootMeshGroup = createDetailedFoot(-1);

    // Dời vị trí group khối con tương đối so với Pivot Khớp háng
    rightFootMeshGroup.position.set(0, -HIP_PIVOT_Y, 0);
    leftFootMeshGroup.position.set(0, -HIP_PIVOT_Y, 0);

    legRigR.add(rightFootMeshGroup);
    legRigL.add(leftFootMeshGroup);

    // Điểm Pivot xoay cánh tay đặt ở khớp cầu vai (Shoulder Joint Y = 3.72m)
    const SHOULDER_PIVOT_Y = 3.72;
    armRigR.position.set(0, SHOULDER_PIVOT_Y, 0);
    armRigL.position.set(0, SHOULDER_PIVOT_Y, 0);

    const rightArmMeshGroup = createDetailedArm(1);
    const leftArmMeshGroup = createDetailedArm(-1);

    rightArmMeshGroup.position.set(0, -SHOULDER_PIVOT_Y, 0);
    leftArmMeshGroup.position.set(0, -SHOULDER_PIVOT_Y, 0);

    armRigR.add(rightArmMeshGroup);
    armRigL.add(leftArmMeshGroup);

    modelGroup.add(pelvisRig); // Khung chậu, Hông & Thân trên
    modelGroup.add(legRigR);   // Chân Phải
    modelGroup.add(legRigL);   // Chân Trái
    modelGroup.add(armRigR);   // Tay Phải
    modelGroup.add(armRigL);   // Tay Trái

    // Áp dụng trạng thái màu sắc từ DB lên các khối
    function applyDBToMeshes() {
      clickableMeshes.forEach(mesh => {
        const id = mesh.userData.id;
        const record = localDB[id];
        if (record && record.status !== 'ok') {
          mesh.material.color.setHex(COLOR_PALETTE.marked_flag);
        } else {
          mesh.material.color.setHex(mesh.userData.defaultColor);
        }
      });
    }

    // Khởi động đồng bộ DB ngay khi nạp trang
    initDB();

    // ==========================================
    // 5. CHẾ ĐỘ CHỌN NHÓM VỚI PHÍM 'M' (MULTI-SELECTION)
    // ==========================================
    let isMultiSelectMode = false;
    let selectedSet = new Set(); // Chứa danh sách mesh đang chọn

    const modeBadge = document.getElementById('mode-badge');
    const modeText = document.getElementById('mode-text');
    const statSelected = document.getElementById('stat-selected');
    const statMarked = document.getElementById('stat-marked');
    const statTotal = document.getElementById('stat-total');

    function updateStats() {
      statTotal.innerText = clickableMeshes.length;
      statSelected.innerText = selectedSet.size;
      const markedCount = Object.keys(localDB).filter(id => localDB[id].status !== 'ok').length;
      statMarked.innerText = markedCount;
    }
    updateStats();

    function setMeshHighlight(mesh, isSelected) {
      const hl = mesh.getObjectByName('selection_highlight');
      if (hl) hl.visible = isSelected;
    }

    function toggleMultiSelectMode() {
      if (!isMultiSelectMode) {
        // BẮT ĐẦU CHẾ ĐỘ CHỌN NHÓM
        isMultiSelectMode = true;
        modeBadge.classList.add('active-multi');
        modeText.innerText = '🔴 Đang chọn NHÓM (Ấn M lại để Lưu)';
        // Ẩn bảng inspect cũ nếu đang mở
        inspectCard.style.display = 'none';
      } else {
        // KẾT THÚC CHỌN NHÓM -> MỞ BẢNG GHI CHÚ ĐỂ LƯU THAY ĐỔI
        isMultiSelectMode = false;
        modeBadge.classList.remove('active-multi');
        modeText.innerText = 'Chế độ: Đơn lẻ (Single)';

        if (selectedSet.size > 0) {
          openGroupInspector();
        } else {
          inspectCard.style.display = 'none';
        }
      }
    }

    // Lắng nghe phím 'M'
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        return; // Đang gõ văn bản thì không kích hoạt
      }
      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleMultiSelectMode();
      }
    });

    // ==========================================
    // 6. RAYCASTING: CLICK VÀO KHỐI
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const inspectCard = document.getElementById('inspect-card');
    const cardPartName = document.getElementById('card-part-name');
    const cardBlockId = document.getElementById('card-block-id');
    const cardDimensions = document.getElementById('card-dimensions');
    const cardStatus = document.getElementById('card-status');
    const cardNote = document.getElementById('card-note');
    const btnSaveMark = document.getElementById('btn-save-mark');
    const btnCloseCard = document.getElementById('btn-close-card');
    const groupSelectedContainer = document.getElementById('group-selected-container');
    const groupChips = document.getElementById('group-chips');
    const groupCount = document.getElementById('group-count');
    const dimField = document.getElementById('dim-field');

    window.addEventListener('click', (e) => {
      // Bỏ qua click trên các panel UI
      if (e.target.closest('#ui-panel') || e.target.closest('#inspect-card') || e.target.closest('#tip-bar')) {
        return;
      }

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableMeshes);

      if (intersects.length > 0) {
        const clickedMesh = intersects[0].object;

        if (isMultiSelectMode) {
          // Trong chế độ chọn nhóm: Click để thêm hoặc bỏ chọn
          if (selectedSet.has(clickedMesh)) {
            selectedSet.delete(clickedMesh);
            setMeshHighlight(clickedMesh, false);
          } else {
            selectedSet.add(clickedMesh);
            setMeshHighlight(clickedMesh, true);
          }
          updateStats();
        } else {
          // Chế độ đơn lẻ bình thường: Xóa vùng chọn cũ và mở Inspector cho 1 khối
          clearAllHighlights();
          selectedSet.add(clickedMesh);
          setMeshHighlight(clickedMesh, true);
          updateStats();
          openSingleInspector(clickedMesh);
        }
      }
    });

    function clearAllHighlights() {
      selectedSet.forEach(mesh => setMeshHighlight(mesh, false));
      selectedSet.clear();
      updateStats();
    }

    // Mở Inspector cho 1 khối
    function openSingleInspector(mesh) {
      const data = mesh.userData;
      cardPartName.innerText = data.name;
      cardBlockId.innerText = '#' + data.id;
      cardDimensions.innerText = `${data.dimensions[0]}m x ${data.dimensions[1]}m x ${data.dimensions[2]}m`;

      groupSelectedContainer.style.display = 'none';
      dimField.style.display = 'block';

      const record = localDB[data.id] || { status: 'ok', note: '' };
      cardStatus.value = record.status;
      cardNote.value = record.note;

      inspectCard.style.display = 'block';
    }

    // Mở Inspector cho cả NHÓM khối vừa chọn
    function openGroupInspector() {
      cardPartName.innerText = `Đánh dấu nhóm khối`;
      cardBlockId.innerText = `${selectedSet.size} khối đã chọn`;

      dimField.style.display = 'none';
      groupSelectedContainer.style.display = 'block';
      groupCount.innerText = selectedSet.size;

      groupChips.innerHTML = '';
      selectedSet.forEach(mesh => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerText = mesh.userData.id;
        groupChips.appendChild(chip);
      });

      cardStatus.value = 'needs_fix';
      cardNote.value = '';
      cardNote.placeholder = `Nhập lỗi chung cho ${selectedSet.size} khối này (ví dụ: cần nâng cao 0.05m)...`;

      inspectCard.style.display = 'block';
    }

    // ==========================================
    // 7. LƯU THAY ĐỔI VÀO LOCAL DATABASE
    // ==========================================
    btnSaveMark.addEventListener('click', () => {
      if (selectedSet.size === 0) return;

      const status = cardStatus.value;
      const note = cardNote.value.trim();

      selectedSet.forEach(mesh => {
        const id = mesh.userData.id;

        localDB[id] = {
          name: mesh.userData.name,
          dimensions: mesh.userData.dimensions,
          status: status,
          note: note,
          updatedAt: new Date().toISOString()
        };

        // Đổi màu khối: Nếu lỗi thì chuyển đỏ cảnh báo, nếu OK thì về màu gốc
        if (status !== 'ok') {
          mesh.material.color.setHex(COLOR_PALETTE.marked_flag);
        } else {
          mesh.material.color.setHex(mesh.userData.defaultColor);
        }

        setMeshHighlight(mesh, false);
      });

      // Lưu đồng bộ trực tiếp ra file database trên ổ đĩa
      syncToServer(localDB);

      selectedSet.clear();
      updateStats();
      inspectCard.style.display = 'none';
    });

    btnCloseCard.addEventListener('click', () => {
      inspectCard.style.display = 'none';
      clearAllHighlights();
    });

    // ==========================================
    // 8. TIỆN ÍCH DATABASE: XUẤT FILE JSON & XEM TẤT CẢ MARK
    // ==========================================
    // LẮNG NGHE ĐỔI MÀU REAL-TIME TỪ COLOR PICKER PANEL
    function updatePaletteColor(category, hexColor) {
      const colorNum = parseInt(hexColor.replace('#', '0x'));
      COLOR_PALETTE[category] = colorNum;

      clickableMeshes.forEach(mesh => {
        if (mesh.userData.category === category) {
          mesh.userData.defaultColor = colorNum;
          // Nếu không bị mark lỗi thì áp dụng màu mới ngay lập tức
          const isMarked = localDB[mesh.userData.id] && localDB[mesh.userData.id].status !== 'ok';
          if (!isMarked) {
            mesh.material.color.setHex(colorNum);
          }
        }
      });
    }

    document.getElementById('pick-skin').addEventListener('input', (e) => updatePaletteColor('skin', e.target.value));
    document.getElementById('pick-sole').addEventListener('input', (e) => updatePaletteColor('sole', e.target.value));
    document.getElementById('pick-heel').addEventListener('input', (e) => updatePaletteColor('heel', e.target.value));
    document.getElementById('pick-ankle').addEventListener('input', (e) => updatePaletteColor('ankle', e.target.value));
    document.getElementById('pick-nail').addEventListener('input', (e) => updatePaletteColor('nail', e.target.value));
    document.getElementById('pick-hair').addEventListener('input', (e) => updatePaletteColor('hair', e.target.value));
    document.getElementById('hair-length').addEventListener('input', (e) => {
      const t = parseFloat(e.target.value);
      document.getElementById('hair-len-val').innerText = Math.round(t * 100) + '%';
      setHairLength(t);
    });

    // Nút Thu gọn / Mở rộng Bảng Màu Da
    const palettePanel = document.getElementById('palette-panel');
    const btnTogglePalette = document.getElementById('btn-toggle-palette');
    btnTogglePalette.addEventListener('click', () => {
      palettePanel.classList.toggle('collapsed');
      if (palettePanel.classList.contains('collapsed')) {
        btnTogglePalette.innerText = 'Mở rộng ▼';
      } else {
        btnTogglePalette.innerText = 'Thu gọn ▲';
      }
    });

    document.getElementById('btn-sync-file').addEventListener('click', async () => {
      const keys = Object.keys(localDB).filter(k => localDB[k].status !== 'ok');
      if (keys.length === 0) {
        alert("Chưa có khối nào được mark lỗi.");
        return;
      }
      
      const jsonContent = JSON.stringify(localDB, null, 2);

      // Thử dùng File System Access API để lưu trực tiếp vào thư mục nếu trình duyệt hỗ trợ
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'marks_data.json',
            types: [{ description: 'JSON File', accept: { 'application/json': ['.json'] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(jsonContent);
          await writable.close();
          const notice = document.getElementById('sync-notice');
          notice.style.display = 'block';
          notice.innerHTML = '✅ Đã lưu trực tiếp file <b>marks_data.json</b> vào thư mục project! Hãy bảo AI đọc file này.';
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // Fallback: Tải file marks_data.json về
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonContent);
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `marks_data.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      
      const notice = document.getElementById('sync-notice');
      notice.style.display = 'block';
      notice.innerHTML = '✅ File <b>marks_data.json</b> đã được tải xuống! Bạn hãy lưu nó vào thư mục <code>Project Boxer</code> để tôi đọc và sửa ngay.';
    });
    document.getElementById('btn-export-json').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localDB, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `project_boxer_marks_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    document.getElementById('btn-view-data').addEventListener('click', () => {
      const keys = Object.keys(localDB).filter(k => localDB[k].status !== 'ok');
      if (keys.length === 0) {
        alert("Hiện tại chưa có khối nào được đánh dấu lỗi trong Database.");
        return;
      }
      let report = `DANH SÁCH KHỐI ĐÃ MARK LỖI (${keys.length} khối):\n\n`;
      keys.forEach((k, idx) => {
        const item = localDB[k];
        report += `${idx + 1}. [${k}] ${item.name || ''}\n   Trạng thái: ${item.status}\n   Ghi chú: ${item.note || '(Không có ghi chú)'}\n\n`;
      });
      alert(report);
    });

    // ==========================================
    // 9. ANIMATION ENGINE (QUẢN LÝ CÁC CHUYỂN ĐỘNG)
    // ==========================================
    let currentAnim = 'none'; // 'none', 'swing', 'march', 'bounce'
    let animSpeed = 1.0;
    let animTime = 0;

    const btnAnimNone = document.getElementById('btn-anim-none');
    const btnAnimSwing = document.getElementById('btn-anim-swing');
    const btnAnimMarch = document.getElementById('btn-anim-march');
    const btnAnimBounce = document.getElementById('btn-anim-bounce');
    const speedSlider = document.getElementById('anim-speed');
    const speedVal = document.getElementById('speed-val');

    const animButtons = [btnAnimNone, btnAnimSwing, btnAnimMarch, btnAnimBounce];

    function setAnimation(mode, activeBtn) {
      currentAnim = mode;
      animButtons.forEach(btn => btn.classList.remove('active'));
      activeBtn.classList.add('active');

      if (mode === 'none') {
        // Reset về tư thế đứng chuẩn ban đầu
        legRigR.rotation.set(0, 0, 0);
        legRigL.rotation.set(0, 0, 0);
        legRigR.position.set(0, HIP_PIVOT_Y, 0);
        legRigL.position.set(0, HIP_PIVOT_Y, 0);
        armRigR.rotation.set(0, 0, 0);
        armRigL.rotation.set(0, 0, 0);
        armRigR.position.set(0, SHOULDER_PIVOT_Y, 0);
        armRigL.position.set(0, SHOULDER_PIVOT_Y, 0);
        pelvisRig.position.set(0, 0, 0);
      }
    }

    btnAnimNone.addEventListener('click', () => setAnimation('none', btnAnimNone));
    btnAnimSwing.addEventListener('click', () => setAnimation('swing', btnAnimSwing));
    btnAnimMarch.addEventListener('click', () => setAnimation('march', btnAnimMarch));
    btnAnimBounce.addEventListener('click', () => setAnimation('bounce', btnAnimBounce));

    speedSlider.addEventListener('input', (e) => {
      animSpeed = parseFloat(e.target.value);
      speedVal.innerText = animSpeed.toFixed(1) + 'x';
    });

    // ==========================================
    // 10. ĐIỀU KHIỂN CAMERA WASD & QUICK FOCUS PRESETS
    // ==========================================
    const keysPressed = {};

    window.addEventListener('keydown', (e) => {
      // Bỏ qua nếu đang gõ text trong ô input / textarea
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      keysPressed[e.key.toLowerCase()] = true;
      keysPressed[e.code] = true;
    });

    window.addEventListener('keyup', (e) => {
      keysPressed[e.key.toLowerCase()] = false;
      keysPressed[e.code] = false;
    });

    function updateCameraMovement(delta) {
      const moveSpeed = delta * 4.0; // Tốc độ di chuyển camera (m/s)
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);

      const right = new THREE.Vector3();
      right.crossVectors(forward, camera.up).normalize();

      let moved = false;

      // W hoặc Mũi tên lên: Tiến lại gần
      if (keysPressed['w'] || keysPressed['keyw'] || keysPressed['arrowup']) {
        camera.position.addScaledVector(forward, moveSpeed);
        controls.target.addScaledVector(forward, moveSpeed);
        moved = true;
      }
      // S hoặc Mũi tên xuống: Lùi ra xa
      if (keysPressed['s'] || keysPressed['keys'] || keysPressed['arrowdown']) {
        camera.position.addScaledVector(forward, -moveSpeed);
        controls.target.addScaledVector(forward, -moveSpeed);
        moved = true;
      }
      // A hoặc Mũi tên trái: Trượt sang trái
      if (keysPressed['a'] || keysPressed['keya'] || keysPressed['arrowleft']) {
        camera.position.addScaledVector(right, -moveSpeed);
        controls.target.addScaledVector(right, -moveSpeed);
        moved = true;
      }
      // D hoặc Mũi tên phải: Trượt sang phải
      if (keysPressed['d'] || keysPressed['keyd'] || keysPressed['arrowright']) {
        camera.position.addScaledVector(right, moveSpeed);
        controls.target.addScaledVector(right, moveSpeed);
        moved = true;
      }
      // E hoặc Space: Bay lên cao về phía đầu
      if (keysPressed['e'] || keysPressed['keye'] || keysPressed[' ']) {
        camera.position.y += moveSpeed;
        controls.target.y += moveSpeed;
        moved = true;
      }
      // Q hoặc Shift: Hạ thấp độ cao
      if (keysPressed['q'] || keysPressed['keyq'] || keysPressed['shift']) {
        camera.position.y -= moveSpeed;
        controls.target.y -= moveSpeed;
        moved = true;
      }

      if (moved) {
        controls.update();
      }
    }

    // Các nút preset Quick Focus tiện lợi
    const btnFocusHead = document.getElementById('btn-focus-head');
    const btnFocusTorso = document.getElementById('btn-focus-torso');
    const btnFocusLegs = document.getElementById('btn-focus-legs');
    const btnFocusFeet = document.getElementById('btn-focus-feet');
    const btnFocusAll = document.getElementById('btn-focus-all');
    const focusBtns = [btnFocusHead, btnFocusTorso, btnFocusLegs, btnFocusFeet, btnFocusAll];

    function setFocusActive(activeBtn) {
      focusBtns.forEach(b => b.classList.remove('active'));
      if (activeBtn) activeBtn.classList.add('active');
    }

    function smoothFocusCamera(targetY, camDist = 1.25, camX = 0.45, camYOffset = 0.05) {
      controls.target.set(0, targetY, 0);
      camera.position.set(camX, targetY + camYOffset, camDist);
      controls.update();
    }

    btnFocusHead.addEventListener('click', () => {
      smoothFocusCamera(4.32, 1.20, 0.45, 0.04); // Soi cận cảnh đầu & mặt võ sĩ ở cự ly 1.2m
      setFocusActive(btnFocusHead);
    });

    btnFocusTorso.addEventListener('click', () => {
      smoothFocusCamera(3.40, 2.20, 1.10, 0.10); // Soi ngực, bụng, vai, cánh tay
      setFocusActive(btnFocusTorso);
    });

    btnFocusLegs.addEventListener('click', () => {
      smoothFocusCamera(1.80, 2.40, 1.20, 0.0); // Soi đùi & cẳng chân
      setFocusActive(btnFocusLegs);
    });

    btnFocusFeet.addEventListener('click', () => {
      smoothFocusCamera(0.35, 1.70, 0.90, 0.20); // Soi bàn chân & 5 ngón chân
      setFocusActive(btnFocusFeet);
    });

    btnFocusAll.addEventListener('click', () => {
      controls.target.set(0, 2.30, 0.0);
      camera.position.set(4.6, 3.8, 6.8); // Toàn thân
      controls.update();
      setFocusActive(btnFocusAll);
    });

    // ==========================================
    // 11. ANIMATION LOOP & RESIZE
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      // CẬP NHẬT CAMERA WASD
      updateCameraMovement(delta);

      // CẬP NHẬT ANIMATION CHÂN & CÁNH TAY ĐỒNG BỘ
      if (currentAnim !== 'none') {
        animTime += delta * animSpeed * 3.8;

        if (currentAnim === 'swing') {
          // 1. ĐƯA CHÂN & VUNG TAY SO LE TỰ NHIÊN (WALK SWING)
          const angle = Math.sin(animTime) * 0.38;
          legRigR.rotation.x = angle;
          legRigL.rotation.x = -angle;

          // Tay vung ngược pha với chân cùng bên
          armRigR.rotation.x = -angle * 0.75;
          armRigL.rotation.x = angle * 0.75;

          legRigR.position.y = HIP_PIVOT_Y + Math.max(0, Math.sin(animTime)) * 0.05;
          legRigL.position.y = HIP_PIVOT_Y + Math.max(0, -Math.sin(animTime)) * 0.05;
          pelvisRig.position.y = Math.abs(Math.sin(animTime)) * 0.03;

        } else if (currentAnim === 'march') {
          // 2. NHẤC CHÂN LÊN XUỐNG DẬM CHÂN TẠI CHỖ (MARCH)
          const liftR = Math.max(0, Math.sin(animTime));
          const liftL = Math.max(0, Math.sin(animTime + Math.PI));

          legRigR.position.y = HIP_PIVOT_Y + liftR * 0.22;
          legRigL.position.y = HIP_PIVOT_Y + liftL * 0.22;

          legRigR.rotation.x = liftR * 0.25;
          legRigL.rotation.x = liftL * 0.25;

          armRigR.rotation.x = -liftL * 0.35;
          armRigL.rotation.x = -liftR * 0.35;

        } else if (currentAnim === 'bounce') {
          // 3. NHÚN CHÂN BOXER ĐẶC TRƯNG (SHUFFLE)
          const bounce = Math.abs(Math.sin(animTime * 1.5)) * 0.09;
          const shift = Math.sin(animTime * 0.75) * 0.07;

          legRigR.position.y = HIP_PIVOT_Y + bounce;
          legRigL.position.y = HIP_PIVOT_Y + Math.abs(Math.cos(animTime * 1.5)) * 0.09;
          pelvisRig.position.y = bounce * 0.85;
          armRigR.position.y = SHOULDER_PIVOT_Y + bounce * 0.9;
          armRigL.position.y = SHOULDER_PIVOT_Y + bounce * 0.9;

          legRigR.rotation.x = shift * 0.15;
          legRigL.rotation.x = -shift * 0.15;
          armRigR.rotation.z = 0.06 + Math.sin(animTime * 1.5) * 0.04;
          armRigL.rotation.z = -0.06 - Math.sin(animTime * 1.5) * 0.04;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
